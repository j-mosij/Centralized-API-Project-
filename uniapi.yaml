apiVersion: "warp.network/v1alpha1"
kind: "ApiTile"
metadata:
  tileId: "tile_0x8f9a2c3e1b0d"
  name: "universal-data-stream"
  author: "jmosij"
  category: "data-driven" # Supported: generation, data-driven, fast, ml, iot, custom
  version: "1.0.0"
  immutableHash: "sha256-a1b2c3d4e5f67890123456789abcdef0123456789abcdef0123456789abcdef"

spec:
  # Source definition - Preserves native payload state without modification
  origin:
    type: "direct-node"
    databaseLibraryUri: "msc://library.warp.network/tiles/tile_0x8f9a2c3e1b0d"
    nativeFormat: "raw-json-stream"

  # Dynamic Pricing Engine Parameters
  economics:
    pricingModel: "supply-demand-curve"
    baseCostTokens: 0.05
    maxSupplyCapacity: 1000
    alphaDampening: 0.85
    payoutAddress: "0x3f5CEe507c549738d810245037d0032b4b0eA13a"

  # Cryptographic Transport Boundaries
  security:
    curve: "secp256k1" # Elliptic Curve configuration
    signatureRequired: true
    encryptionMode: "ECDH-AES-GCM-256"
    metamaterialContainer:
      isolationLevel: "strict-wasm-sandbox"
      allowDomAccess: false
      memoryLimitMb: 64

  # Native UI / Component Embed
  uiTile:
    containerElement: "warp-tile-root"
    embeddedScriptHash: "sha256-f8e9d7c6b5a432100123456789abcdef0123456789abcdef0123456789abcdef"
    styleVariant: "tile-dark"
